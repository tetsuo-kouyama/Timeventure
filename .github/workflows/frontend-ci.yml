name: Frontend CI

# main/develop ブランチへの Pull Request および Push 時に実行
on:
  pull_request:
    branches: [main, develop]
    paths:
      # frontend ディレクトリ配下、またはこのワークフロー自体の変更時のみ Frontend CI を実行する
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  # 1. 静的解析（ESLint）
  lint:
    runs-on: ubuntu-latest

    # 以降の run ステップをすべて frontend ディレクトリ配下で実行
    defaults:
      run:
        working-directory: frontend

    steps:
      # ソースコードの取得
      - name: Checkout code
        uses: actions/checkout@v7

      # Node.js 環境のセットアップと npm パッケージのキャッシュ有効化
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 依存パッケージの高速・クリーンインストール
      - name: Install dependencies
        run: npm ci

      # ESLint の実行
      - name: Run ESLint
        run: npm run lint

  # 2. フロントエンドビルド確認
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # プロダクションビルド（Vite によるコンパイル・型チェック）の通過検証
      - name: Build
        run: npm run build
